services:
  mongodb:
    image: mongo:7
    container_name: myrent-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: myrent
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: myrent-api
    restart: unless-stopped
    ports:
      - "7070:7070"
    environment:
      APP_ENV: development
      APP_PORT: "7070"
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: myrent
      JWT_SECRET: dev-secret-change-in-production-min-32-chars
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - api_storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: myrent-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    container_name: myrent-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongodb_data:
  api_storage:
