global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    app: myrentgo
    env: prod

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: myrentgo-api
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    static_configs:
      - targets: ["api:7070"]
        labels:
          component: api
    authorization:
      credentials_file: /etc/prometheus/metrics_token

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
