# Development stack — copy .env.example to .env and set JWT_SECRET (never commit .env).
# Pentest flags hardcoded JWT_SECRET literals; use .env for secrets even in dev.

services:
  # DEV_ONLY_MONGO: puerto 27017 sin auth solo en localhost. Producción: docker-compose.prod.yml (sin puerto publicado).
  mongodb:
    image: mongo:7
    container_name: myrent-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: myrent
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myrent-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "7070:7070"
    environment:
      # Required in .env: JWT_SECRET (≥32 chars). Optional overrides below.
      # Optional (email): SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM
      APP_ENV: development
      APP_PORT: "7070"
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: myrent
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000,http://localhost:5173,http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4000}
      # localhost en .env no alcanza Mailpit desde el contenedor; mailpit = servicio en la misma red
      SMTP_HOST: ${SMTP_DOCKER_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MyRent Go}
      EMAIL_SCHEDULER_ENABLED: ${EMAIL_SCHEDULER_ENABLED:-true}
      EMAIL_SCHEDULER_INTERVAL: ${EMAIL_SCHEDULER_INTERVAL:-24h}
      DOCUMENTS_PATH: /app/storage/documents
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-30}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - api_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myrent-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - api

volumes:
  mongodb_data:
  api_storage:

