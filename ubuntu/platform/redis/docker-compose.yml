version: "3.8"

# Redis — cache y colas (plataforma compartida)
# Docs: ../../docs/help/redis.md
services:
  redis:
    image: redis:7.4-alpine
    container_name: platform-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      - --appendonly
      - ${REDIS_APPENDONLY:-yes}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  platform-net:
    external: true

volumes:
  redis_data:
