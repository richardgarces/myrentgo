services:
  mongodb:
    image: mongo:7
    container_name: myrent-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: myrent
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myrent-api
    restart: unless-stopped
    ports:
      - "7070:7070"
    environment:
      # Required: MONGODB_URI, JWT_SECRET, CORS_ORIGINS, FRONTEND_URL
      # Optional (email): SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM
      APP_ENV: development
      APP_PORT: "7070"
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: myrent
      JWT_SECRET: dev-secret-change-in-production-min-32-chars
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      # localhost en .env no alcanza Mailpit desde el contenedor; mailpit = servicio en la misma red
      SMTP_HOST: ${SMTP_DOCKER_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MyRent Go}
      EMAIL_SCHEDULER_ENABLED: ${EMAIL_SCHEDULER_ENABLED:-true}
      EMAIL_SCHEDULER_INTERVAL: ${EMAIL_SCHEDULER_INTERVAL:-24h}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - api_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myrent-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mongodb_data:
  api_storage:
