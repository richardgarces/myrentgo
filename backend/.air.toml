# Hot reload para desarrollo — usado por ./myrent.sh watch / api-watch
# Instalar air: go install github.com/air-verse/air@latest

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "testdata", "storage"]
  exclude_regex = ["_test\\.go"]
  delay = 800
  send_interrupt = true
  kill_delay = "500ms"
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
